<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F4D43">
  <meta name="description" content="Pronostics ATP entre amis">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icone-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pronos Tennis">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pronos Tennis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" aria-live="polite">
    <p class="chargement">Chargement…</p>
  </div>
  <script>
    // Filet de sécurité : si rien ne s'est affiché après 15 s (réseau coupé, bibliothèque inaccessible…), on le dit clairement.
    setTimeout(function () {
      var c = document.querySelector('#app > .chargement');
      if (c) c.innerHTML = 'Le chargement prend trop de temps. Vérifie ta connexion internet puis <a href="">réessaie</a>. Si cela dure, préviens Pierre.';
    }, 15000);
  </script>
  <script type="module" src="app.js"></script>
  <noscript>Cette application a besoin de JavaScript.</noscript>
</body>
</html>
