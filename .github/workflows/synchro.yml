# Synchronisation automatique avec la Live Tennis API.
#  - Déclenché toutes les 20 minutes par Supabase (pg_cron, migration 0023) et, en secours, toutes les 30 minutes par le cron de GitHub, SI la variable de dépôt SYNCHRO_ACTIVE vaut « true » (Settings > Secrets and variables > Actions > Variables).
#  - À la demande (onglet Actions > « Synchronisation API » > Run workflow), avec le choix du mode :
#      diagnostic : quelques appels à l'API pour en découvrir la forme réelle (aucune écriture dans la base)
#      simulation : comme un vrai passage, mais n'écrit rien dans la base
#      normal     : vrai passage
#      sonde      : exploration de l'API pour retrouver les tournois déjà joués (lecture seule)
#      h2h-essai : vérifie les téléchargements H2H avec une paire fictive (Sinner – Alcaraz), sans toucher à la base
#      h2h-simulation / h2h : seulement le calcul des face-à-face (H2H), sans enregistrer / en enregistrant (le calcul a aussi lieu à chaque passage normal)
# Secrets nécessaires (Settings > Secrets and variables > Actions > Secrets) :
#   LIVETENNIS_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# Le programme (src/sync/) n'a aucune dépendance à installer ; les fenêtres horaires (7 h – 1 h, heure de Paris) sont gérées par le programme.
name: Synchronisation API

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        type: choice
        default: diagnostic
        options: [diagnostic, simulation, normal, sonde, h2h-simulation, h2h, h2h-essai]
      origine:
        description: 'Origine (« supabase » : déclenchement automatique toutes les 20 min, soumis à SYNCHRO_ACTIVE)'
        type: string
        default: manuel

permissions:
  contents: read

# Jamais deux passages en même temps (un passage en retard attend le précédent).
concurrency:
  group: synchro-api
  cancel-in-progress: false

jobs:
  synchro:
    if: (github.event_name == 'workflow_dispatch' && inputs.origine != 'supabase') || vars.SYNCHRO_ACTIVE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Passage de synchronisation
        env:
          LIVETENNIS_API_KEY: ${{ secrets.LIVETENNIS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODE: ${{ inputs.mode || 'normal' }}
        run: |
          case "$MODE" in
            diagnostic) node src/sync/cli.js --diagnostic ;;
            simulation) node src/sync/cli.js --simulation ;;
            sonde)      node src/sync/cli.js --sonde ;;
            h2h|h2h-simulation|h2h-essai) echo "Synchronisation de l'API ignorée (mode $MODE)." ;;
            *)          node src/sync/cli.js ;;
          esac
      # Notifications par e-mail (Brevo). Sans clé ou sans adresse d'expéditeur, cette étape ne fait rien. Elle n'échoue jamais.
      - name: Notifications par e-mail
        if: ${{ !cancelled() && inputs.mode != 'diagnostic' && inputs.mode != 'sonde' && !startsWith(inputs.mode, 'h2h') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          NOTIF_EXPEDITEUR: ${{ secrets.NOTIF_EXPEDITEUR }}
        run: node src/sync/notif-cli.js
      # Notifications push (web push) : mêmes événements que les courriels. Les clés VAPID sont créées au premier passage et rangées dans la base.
      - name: Notifications push
        if: ${{ !cancelled() && inputs.mode != 'diagnostic' && inputs.mode != 'sonde' && !startsWith(inputs.mode, 'h2h') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm ci --omit=dev --no-audit --no-fund || echo "installation de web-push impossible : notifications push ignorées"
          node src/sync/push-cli.js
      # Face-à-face (H2H) : seulement s'il y a des paires de joueurs à calculer ; les fichiers de résultats ATP sont gardés dans le cache
      # de GitHub Actions (jamais dans le dépôt : leur licence interdit de les redistribuer).
      - name: H2H — des paires à calculer ?
        id: h2h_besoin
        if: ${{ !cancelled() && inputs.mode != 'diagnostic' && inputs.mode != 'sonde' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.mode }}" = "h2h-essai" ]; then node src/sync/h2h-cli.js --besoin --essai; else node src/sync/h2h-cli.js --besoin; fi
      - name: H2H — fichiers conservés
        if: steps.h2h_besoin.outputs.besoin == 'true'
        uses: actions/cache/restore@v4
        with:
          path: h2h-donnees
          key: h2h-donnees-v1-${{ github.run_id }}
          restore-keys: h2h-donnees-v1-
      - name: H2H — calcul
        id: h2h
        if: steps.h2h_besoin.outputs.besoin == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODE: ${{ inputs.mode || 'normal' }}
        run: |
          case "$MODE" in
            h2h-essai) node src/sync/h2h-cli.js --essai ;;
            h2h-simulation) node src/sync/h2h-cli.js --simulation ;;
            *) node src/sync/h2h-cli.js ;;
          esac
      - name: H2H — conserver les fichiers téléchargés
        if: ${{ !cancelled() && steps.h2h.outputs.modifie == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: h2h-donnees
          key: h2h-donnees-v1-${{ github.run_id }}
